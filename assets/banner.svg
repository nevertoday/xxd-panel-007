<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
<title>XXD Panel 007</title><desc>Handwritten everyday observation atlas with small source-bound physical fragments, loose white-paper rhythm, thin black notes, warm clean colour, and scanned pigment texture.</desc>
